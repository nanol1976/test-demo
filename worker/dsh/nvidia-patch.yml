# Batch33 · dsh headless 用的 NVIDIA 路由（临时叠加，不改 ~/.dsh 里的 profile）
#
# 为什么需要这一层：两台机器的 NVIDIA 段只写在 GUI profile（Windows=desktop、Mac=web），
# headless profile 是空的 []，直接 `dsh headless` 会退回 bundle 默认的 DeepSeek 路由。
# 这里用 `--patch` 把它补上，退出码 0 的 stdout 就是执行结果。
#
# 换模型只改这份文件：agent-default-model 与 llm-pi-ai 的模型 id 一起改。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      nvidia:
        baseURL: https://integrate.api.nvidia.com/v1
        models:
          - id: nvidia/nemotron-3.5-lightning-30b-a3b
            name: nemotron-3.5-lightning-30b-a3b
        apiKeyEnv: NVIDIA_API_KEY
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
