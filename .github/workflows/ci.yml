name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # 双保险：脚本内部已经把 ROOT 插进 sys.path，这里再把仓库根作为 PYTHONPATH，
      # 防止将来新增脚本忘了引导、在 CI 上炸 ModuleNotFoundError。
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 静态门禁 + 迁移门禁
        run: python scripts/ci.py --static-only

      - name: 全量测试（含真实起服务冒烟）
        run: python scripts/ci.py
